{% extends 'base.html' %}

{% block extra_css %}
{{ block.super }}
<style>
    .booking-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .booking-form input:not([type="hidden"]),
    .booking-form select,
    .booking-form textarea {
        display: block;
        width: 100%;
        max-width: 400px;
        min-height: 48px;
        padding: 12px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background-color: #fff;
        color: #182433;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
    }

    .booking-form input:focus,
    .booking-form select:focus,
    .booking-form textarea:focus {
        outline: none;
        border-color: #e9a8c4;
        box-shadow: 0 0 0 3px rgba(233, 168, 196, 0.18);
    }

    .booking-form p {
        margin-bottom: 20px;
    }

    .booking-form .errorlist {
        color: #b42318;
    }

    .booking-form button {
        min-height: 48px;
        border-radius: 12px;
    }
</style>
{% endblock %}

{% block content %}
<h1>Бронирование оборудования</h1>

<p>Укажите планируемое время по Москве и цель использования.</p>

<form method="post" class="card card-body booking-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-primary" type="submit">
        Сохранить
    </button>
</form>

<a href="{% url 'booking:list' %}">К списку</a>
{% endblock %}
